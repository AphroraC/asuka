site_name: "Asuka"
site_description: "Robust, minimal and extensible LiDAR-inertial SLAM framework"

theme:
  name: material
  palette:
    primary: indigo
  font:
    text: Roboto
  features:
    - content.code.copy

use_directory_urls: false

markdown_extensions:
  - meta
  - attr_list
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - 首页: index.md
  - 安装: installation.md
  - Docker: docker.md
  - 快速上手: quickstart.md
  - 参数速查: parameters.md
  - 点云格式: point_type.md
  - "项目入口与运行形态":
      - "项目总览与架构地图": wiki/entry/01.md
      - "ROS 节点入口 asuka_rosnode": wiki/entry/02.md
      - "nodelet 与 rosbag 两种运行形态": wiki/entry/03.md
  - "ROS 封装与数据接入主链路":
      - "AsukaROS 构造装配与模块装载": wiki/ros/01.md
